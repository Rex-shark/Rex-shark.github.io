<!doctype html>
<!--
  分享預覽圖（public/og.jpg，1200×630）的原始稿。
  重新產生：用 headless Chrome 以 1200×630 視窗截這個檔案成 PNG，再轉成 JPG 放到 public/og.jpg。
  文字取自 spec/info.md（名字、職稱、自介第一句），改資料時這裡一起改。
-->
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <style>
      @font-face {
        font-family: 'Geist Variable';
        src: url('../node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2') format('woff2');
        font-weight: 100 900;
      }
      * { box-sizing: border-box; margin: 0; }
      html, body { width: 1200px; height: 630px; overflow: hidden; }
      body {
        display: flex;
        align-items: center;
        gap: 64px;
        padding: 0 80px;
        color: #e9edf3;
        font-family: 'Geist Variable', 'PingFang TC', 'Noto Sans TC', sans-serif;
        background:
          radial-gradient(900px 500px at 15% 20%, rgba(138, 176, 255, 0.16), transparent 70%),
          radial-gradient(700px 500px at 95% 100%, rgba(244, 114, 182, 0.12), transparent 70%),
          #1c2027;
      }
      .card {
        flex: none;
        width: 480px;
        padding: 8px;
        border-radius: 32px;
        background: linear-gradient(135deg, #a78bfa, #f472b6 55%, #fb923c);
        box-shadow: 0 30px 60px rgba(0, 0, 0, 0.45);
        transform: rotate(-3deg);
      }
      .art { position: relative; aspect-ratio: 3 / 2; border-radius: 25px; overflow: hidden; }
      .art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      .eyebrow { font-size: 22px; font-weight: 600; letter-spacing: 0.22em; color: #8ab0ff; }
      h1 { margin-top: 14px; font-size: 128px; font-weight: 800; line-height: 1; letter-spacing: -0.03em; }
      .title { margin-top: 26px; font-size: 38px; font-weight: 700; line-height: 1.3; }
      .intro { margin-top: 18px; font-size: 25px; line-height: 1.6; color: #a8b1bf; }
      .url { margin-top: 34px; font-size: 24px; font-weight: 600; color: #8ab0ff; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="art">
        <img src="../src/pages/home/assets/cards/hero/bg.webp" alt="" />
        <img src="../src/pages/home/assets/cards/hero/body.webp" alt="" />
      </div>
    </div>
    <div>
      <p class="eyebrow">REX 的手牌</p>
      <h1>Rex</h1>
      <p class="title">Java 全端工程師<br />系統分析師</p>
      <p class="intro">從後端核心架構到前端使用者體驗</p>
      <p class="url">rex-shark.github.io</p>
    </div>
  </body>
</html>
